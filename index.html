<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background-color: #0d0d14;
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
        }
        .hidden { display: none !important; }

        /* القائمة الرئيسية */
        #menuScreen {
            background: radial-gradient(circle at center, #1e1b4b 0%, #09090b 100%);
        }
        .arcade-badge {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid #f59e0b;
            color: #fbbf24;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        h1 {
            font-size: clamp(32px, 5vw, 56px);
            color: #f59e0b;
            text-shadow: 0 4px 25px rgba(245, 158, 11, 0.5);
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            font-size: clamp(15px, 2vw, 20px);
            color: #9ca3af;
            margin-bottom: 40px;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 950px;
            width: 90%;
        }
        .card {
            background: rgba(31, 41, 55, 0.85);
            border: 3px solid #374151;
            border-radius: 16px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
        }
        .card:hover, .card:focus {
            border-color: #f59e0b;
            background: #1f2937;
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 12px 30px rgba(245, 158, 11, 0.3);
            outline: none;
        }
        .card-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }
        .card h3 { font-size: 22px; color: #fff; margin-bottom: 6px; }
        .card p { font-size: 14px; color: #9ca3af; }

        /* شاشة اللعب */
        #gameScreen { background: #050508; }
        .top-bar {
            position: absolute;
            top: 15px;
            width: 90%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .back-btn {
            background: #dc2626;
            color: #fff;
            border: none;
            padding: 10px 22px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
            transition: 0.2s;
        }
        .back-btn:hover { background: #b91c1c; transform: scale(1.05); }
        .score-board {
            background: #1f2937;
            border: 2px solid #f59e0b;
            color: #fbbf24;
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
        }
        .hint-text {
            color: #9ca3af;
            font-size: 14px;
            margin-top: 12px;
        }
